name: Build Sync APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Annotate Failure
        if: failure()
        run: |
          grep -E -C 2 "(e: |error:|FAILED|Exception|Caused by:)" build.log | tail -n 50 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Locate and Verify APK
        if: success()
        run: |
          ls -la app/build/outputs/apk/debug/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sync-Music-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
